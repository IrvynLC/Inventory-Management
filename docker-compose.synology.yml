services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory_management}
      POSTGRES_USER: ${POSTGRES_USER:-inventory_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ims_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    image: inventory-management-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${IMS_PORT:-3000}:3000"
    environment:
      IMS_HOST: 0.0.0.0
      IMS_PORT: 3000
      IMS_PRODUCTION: "1"
      IMS_ALLOW_WEAK_SEEDED_PASSWORDS: ${IMS_ALLOW_WEAK_SEEDED_PASSWORDS:-1}
      IMS_SECURE_COOKIES: ${IMS_SECURE_COOKIES:-0}
      IMS_SESSION_TTL_HOURS: ${IMS_SESSION_TTL_HOURS:-12}
      IMS_SEED_USERS_FILE: config/users.production.json
      IMS_SQLITE_MIGRATION_PATH: /app/data/disabled-sqlite-migration.sqlite
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-inventory_management}
      PGUSER: ${POSTGRES_USER:-inventory_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./config/users.production.json:/app/config/users.production.json:ro

  postgres-backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-inventory_management}
      PGUSER: ${POSTGRES_USER:-inventory_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_DAY_OF_MONTH: ${BACKUP_DAY_OF_MONTH:-1}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-395}
    volumes:
      - ./backups/postgres:/backups
      - ./scripts/synology-monthly-backup.sh:/usr/local/bin/synology-monthly-backup.sh:ro
    command: ["sh", "/usr/local/bin/synology-monthly-backup.sh"]

volumes:
  ims_postgres_data:
